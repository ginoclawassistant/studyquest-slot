<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>StudyQuest 小瑪莉</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <div class="header">
    <div class="title" id="header-title">🎰 小瑪莉</div>
    <div class="subtitle">CASINO CLASSIC</div>
  </div>

  <!-- LED Panels -->
  <div class="led-container">
    <div class="led-panel">
      <div class="led-label">WIN</div>
      <div class="led-value win" id="win-val">00000</div>
    </div>
    <div class="led-panel">
      <div class="led-label">COINS</div>
      <div class="led-value coin" id="coins-val">00010</div>
    </div>
  </div>

  <!-- Game Grid -->
  <div class="grid-wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Paytable -->
  <div class="paytable">
    <div class="pay-item"><span class="symbol">🍊</span><span class="rate">×5</span></div>
    <div class="pay-item"><span class="symbol">🍎</span><span class="rate">×5</span></div>
    <div class="pay-item"><span class="symbol">🍋</span><span class="rate">×15</span></div>
    <div class="pay-item"><span class="symbol">🍉</span><span class="rate">×20</span></div>
    <div class="pay-item"><span class="symbol">🔔</span><span class="rate">×20</span></div>
    <div class="pay-item"><span class="symbol">⭐</span><span class="rate">×30</span></div>
    <div class="pay-item"><span class="symbol">77</span><span class="rate">×40</span></div>
    <div class="pay-item"><span class="symbol">BAR</span><span class="rate">×100</span></div>
  </div>

  <!-- Message -->
  <div class="message" id="message">投入金幣，開始遊戲！</div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn spin" id="btn-spin">🎰 旋 轉</button>
    <button class="btn" id="btn-claim" style="display:none; background:linear-gradient(180deg,#006644,#004433);border-color:#00aa66;box-shadow:0 3px 0 #002211;">✨ 領取金幣</button>
  </div>

  <!-- Bottom info -->
  <div class="bottom-info">
    拉霸幣 10 : StudyQuest金幣 1&nbsp;|&nbsp;答對全部題目獲得10枚拉霸幣
  </div>

  <!-- Score Popup -->
  <div class="score-popup" id="score-popup">
    <h2>🎉 結算</h2>
    <div class="coins" id="result-coins">0 拉霸幣</div>
    <p id="result-gold">0 StudyQuest 金幣 ✨</p>
    <button id="btn-ok">確定</button>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
